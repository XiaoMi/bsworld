<!-- The content attribute also contains the editable diagrams.net diagram. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562"
     role="img" aria-labelledby="title description"
     content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram name=&quot;BSWorld architecture&quot; id=&quot;bsworld-architecture&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">BSWorld architecture</title>
  <desc id="description">Two UML Guests connect through virtio Bluetooth and a Bumble peer connects over an H4 socket.
    Three BSController workers share one BabbleSim PHY. The pytest event loop schedules each Guest over a
    separate time-travel socket and connects to the PHY through a clock FIFO.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { fill: #163145; font-size: 22px; font-weight: 700; }
    .detail { fill: #476277; font-size: 15px; font-weight: 400; }
    .process-label { fill: #3c536e; font-size: 17px; font-weight: 700; }
    .hci-label { fill: #365b7e; font-size: 15px; font-weight: 700; }
    .clock-label { fill: #6d4b89; font-size: 15px; font-weight: 700; }
    .radio-label { fill: #266453; font-size: 15px; font-weight: 700; }
    .links { fill: none; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7f5b9b" />
    </marker>
    <marker id="hci-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4d6f96" />
    </marker>
    <marker id="radio-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3d7e68" />
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="560" rx="16" fill="#ffffff" stroke="#dce5ee" />
  <path d="M 42 253 H 498 V 106 Q 498 94 510 94 H 958 Q 970 94 970 106
           V 397 Q 970 409 958 409 H 42 Q 30 409 30 397 V 265 Q 30 253 42 253 Z"
        fill="#f5f8fd" stroke="#c6d5e7" stroke-width="1.5" />

  <g class="links" aria-label="Simulation time" stroke="#7f5b9b" stroke-dasharray="6 5"
     marker-start="url(#time-arrow)" marker-end="url(#time-arrow)">
    <path d="M 152 135 L 152 51 L 898 51 L 898 135" />
    <path d="M 387 135 L 387 80 L 864 80 L 864 135" />
    <path d="M 854 211 L 854 462" />
  </g>

  <g class="links" aria-label="Bluetooth HCI" stroke="#4d6f96"
     marker-start="url(#hci-arrow)" marker-end="url(#hci-arrow)">
    <path d="M 152 211 L 152 293" />
    <path d="M 387 211 L 387 293" />
    <path d="M 622 211 L 622 293" />
  </g>

  <g class="links" aria-label="Radio data" stroke="#3d7e68"
     marker-start="url(#radio-arrow)" marker-end="url(#radio-arrow)">
    <path d="M 152 369 L 152 462" />
    <path d="M 387 369 L 387 462" />
    <path d="M 622 369 L 622 462" />
  </g>

  <g id="guest-a" text-anchor="middle">
    <rect x="53" y="135" width="198" height="76" rx="11" fill="#ffffff" stroke="#aebfd0" stroke-width="1.5" />
    <text class="title" x="152" y="169">UML Guest A</text>
    <text class="detail" x="152" y="193">Zephyr / NuttX</text>
  </g>

  <g id="guest-b" text-anchor="middle">
    <rect x="288" y="135" width="198" height="76" rx="11" fill="#ffffff" stroke="#aebfd0" stroke-width="1.5" />
    <text class="title" x="387" y="169">UML Guest B</text>
    <text class="detail" x="387" y="193">BlueZ / NimBLE</text>
  </g>

  <g id="bumble" text-anchor="middle">
    <rect x="523" y="135" width="198" height="76" rx="11" fill="#ffffff" stroke="#aebfd0" stroke-width="1.5" />
    <text class="title" x="622" y="180">Bumble peer</text>
  </g>

  <g id="loop" text-anchor="middle">
    <rect x="758" y="135" width="192" height="76" rx="11" fill="#f2ecf8" stroke="#c5b0d7" stroke-width="1.5" />
    <text class="title" x="854" y="169">pytest event loop</text>
    <text class="detail" x="854" y="193">UML calendars + clock</text>
  </g>

  <g id="controller-a" text-anchor="middle">
    <rect x="53" y="293" width="198" height="76" rx="11" fill="#e8f0fc" stroke="#9eb6d8" stroke-width="1.5" />
    <text class="title" x="152" y="327">BSController</text>
    <text class="detail" x="152" y="351">Worker A</text>
  </g>

  <g id="controller-b" text-anchor="middle">
    <rect x="288" y="293" width="198" height="76" rx="11" fill="#e8f0fc" stroke="#9eb6d8" stroke-width="1.5" />
    <text class="title" x="387" y="327">BSController</text>
    <text class="detail" x="387" y="351">Worker B</text>
  </g>

  <g id="controller-c" text-anchor="middle">
    <rect x="523" y="293" width="198" height="76" rx="11" fill="#e8f0fc" stroke="#9eb6d8" stroke-width="1.5" />
    <text class="title" x="622" y="327">BSController</text>
    <text class="detail" x="622" y="351">Worker C</text>
  </g>

  <g id="phy" text-anchor="middle">
    <rect x="53" y="462" width="897" height="71" rx="11" fill="#e5f3eb" stroke="#91bcaa" stroke-width="1.5" />
    <text class="title" x="501.5" y="493">BabbleSim PHY</text>
    <text class="detail" x="501.5" y="517">BLE modem and channel model</text>
  </g>

  <text class="clock-label" x="524" y="33" text-anchor="middle">UML time-travel sockets</text>
  <text class="process-label" x="523" y="117">BSWorld / pytest process</text>
  <text class="hci-label" x="166" y="242">HCI via virtio</text>
  <text class="hci-label" x="401" y="242">HCI via virtio</text>
  <text class="hci-label" x="636" y="242">H4 Unix socket</text>
  <text class="radio-label" x="166" y="435">Radio FIFO</text>
  <text class="radio-label" x="401" y="435">Radio FIFO</text>
  <text class="radio-label" x="636" y="435">Radio FIFO</text>
  <text class="clock-label" x="868" y="435">Clock FIFO</text>
</svg>
