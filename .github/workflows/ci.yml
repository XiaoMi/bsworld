# Runs every check in parallel and reports one result. A failing check does
# not stop the others; CI result fails if any of them failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Replace obsolete PR checks, but keep every main commit eligible for a release.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    if: github.event_name != 'release'
    uses: ./.github/workflows/checks.yml

  bscontroller:
    name: BSController
    if: github.event_name != 'release'
    uses: ./.github/workflows/bscontroller.yml

  # A release only tags the platform images its commit already published.
  zephyr:
    name: Zephyr
    uses: ./.github/workflows/zephyr.yml
    permissions:
      contents: read
      packages: write
    with:
      rebuild_image: ${{ inputs.rebuild_image || false }}

  nuttx:
    name: NuttX
    uses: ./.github/workflows/nuttx.yml
    permissions:
      contents: read
      packages: write
    with:
      rebuild_image: ${{ inputs.rebuild_image || false }}

  trouble:
    name: TrouBLE
    uses: ./.github/workflows/trouble.yml
    permissions:
      contents: read
      packages: write
    with:
      rebuild_image: ${{ inputs.rebuild_image || false }}

  linux:
    name: Linux
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read
      packages: write
    with:
      rebuild_image: ${{ inputs.rebuild_image || false }}

  result:
    # The one check branch protection requires.
    name: CI result
    needs: [checks, bscontroller, zephyr, nuttx, trouble, linux]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        # Checks a release does not run are skipped; anything else must pass.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf 'Some checks did not pass:\n%s\n' "$RESULTS" >&2
          exit 1
