# NuttX BTSak and NimBLE simulator firmware.
# Builds bsworld-nuttx from docker/nuttx.Dockerfile and runs its tests.
name: NuttX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Replace obsolete PR checks, but keep every main commit eligible for a release.
  group: nuttx-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nuttx:
    name: NuttX
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: nuttx
      suites: tests/integration/nuttx
      rebuild_image: ${{ inputs.rebuild_image || false }}
