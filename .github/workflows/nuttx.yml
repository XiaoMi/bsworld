# NuttX BTSak and NimBLE simulator firmware.
# Builds bsworld-nuttx from docker/nuttx.Dockerfile and runs its tests.
name: NuttX

# The CI workflow calls this one; run it alone from the Actions tab.
on:
  workflow_call:
    inputs:
      rebuild_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Image
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: nuttx
      suites: tests/integration/nuttx
      rebuild_image: ${{ inputs.rebuild_image || false }}
