# Native TrouBLE Rust Hosts.
# Builds bsworld-trouble from docker/trouble.Dockerfile and runs its tests.
name: TrouBLE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Replace obsolete PR checks, but keep every main commit eligible for a release.
  group: trouble-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trouble:
    name: TrouBLE
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: trouble
      suites: tests/integration/trouble
      rebuild_image: ${{ inputs.rebuild_image || false }}
