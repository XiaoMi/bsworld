# Native TrouBLE Rust Hosts.
# Builds bsworld-trouble from docker/trouble.Dockerfile and runs its tests.
name: TrouBLE

# The CI workflow calls this one; run it alone from the Actions tab.
on:
  workflow_call:
    inputs:
      rebuild_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Image
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: trouble
      suites: tests/integration/trouble
      rebuild_image: ${{ inputs.rebuild_image || false }}
