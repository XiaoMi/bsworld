name: Code style

on:
  push:
    # Branches only: a release tag points at a commit that was already tested.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Code style result
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install pinned Python formatter
        run: python -m pip install 'ruff==0.14.10'

      - name: Check all Python source and imports
        run: python -m ruff check --no-cache .

      - name: Check Python formatting
        run: python -m ruff format --check --no-cache .
