# Zephyr Bluetooth shells; also the Bumble and BabbleSim suites, which need no
# firmware of their own.
# Builds bsworld-zephyr from docker/zephyr.Dockerfile and runs its tests.
name: Zephyr

# The CI workflow calls this one; run it alone from the Actions tab.
on:
  workflow_call:
    inputs:
      rebuild_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Image
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: zephyr
      suites: tests/integration/zephyr
      rebuild_image: ${{ inputs.rebuild_image || false }}
