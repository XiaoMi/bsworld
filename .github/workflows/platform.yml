# Builds, tests and publishes one platform image. Each platform workflow calls
# this one, so the platforms run and publish independently of each other.
name: Platform image

on:
  workflow_call:
    inputs:
      platform:
        description: Bake target and image suffix, e.g. zephyr for bsworld-zephyr
        type: string
        required: true
      suites:
        description: Test directories the image runs, separated by spaces
        type: string
        required: true
      rebuild_image:
        description: Rebuild all image layers without the cache
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PLATFORM: ${{ inputs.platform }}

jobs:
  test:
    name: Build and test
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      # Pull requests from forks receive read-only package access.
      packages: write
    env:
      SUITES: ${{ inputs.suites }}
      TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Only main publishes the image and refreshes the build cache.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space for the firmware build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Prepare names, reports and the package version
        run: |
          python -m pip install 'setuptools-scm>=9.2'
          package_version="$(python -m setuptools_scm)"
          if [[ -z "$package_version" || "$package_version" == '0+unknown' ]]; then
            printf 'Could not determine the BSWorld version from Git.\n' >&2
            exit 1
          fi
          printf 'BSWorld package version: %s\n' "$package_version"
          CI_RESULTS="$RUNNER_TEMP/bsworld-results"
          mkdir -p "$CI_RESULTS"
          # The image runs as UID 1000; the runner user differs.
          chmod a+rwx "$CI_RESULTS"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "BSWORLD_VERSION=$package_version"
            echo "CI_RESULTS=$CI_RESULTS"
            echo "CANDIDATE_IMAGE=bsworld-$PLATFORM:$TAG"
            echo "IMAGE_REPOSITORY=$prefix-$PLATFORM"
            echo "CACHE_REPOSITORY=$prefix-cache"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ${{ inputs.platform }} image
        timeout-minutes: 240
        env:
          # docker/docker-bake.hcl reads these variables.
          BUILD_JOBS: '4'
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
          CACHE_WRITE: ${{ env.PUBLISH }}
          NO_CACHE: ${{ inputs.rebuild_image }}
        run: |
          options=(--progress=plain --load)
          if [[ "$NO_CACHE" == true ]]; then
            options+=(--no-cache)
          fi
          docker buildx bake -f docker/docker-bake.hcl "${options[@]}" "$PLATFORM"

      - name: Run the ${{ inputs.platform }} integration tests
        timeout-minutes: 240
        run: |
          printf '%s\n' "$CANDIDATE_IMAGE" > "$CI_RESULTS/environment.txt"
          docker image inspect "$CANDIDATE_IMAGE" > "$CI_RESULTS/image.json"
          # SUITES lists test directories separated by spaces.
          # shellcheck disable=SC2086
          docker run --rm \
            --mount "type=bind,src=$CI_RESULTS,dst=/output" \
            --env PYTHONDONTWRITEBYTECODE \
            "$CANDIDATE_IMAGE" python -m pytest $SUITES -n auto -p no:cacheprovider \
              --out-dir /output/integration --junitxml=/output/integration.xml \
            2>&1 | tee "$CI_RESULTS/integration.log"

      - name: Summarize test reports
        if: ${{ always() && env.CI_RESULTS != '' }}
        timeout-minutes: 5
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results = Path(os.environ["CI_RESULTS"])
          environment = results / "environment.txt"
          if environment.exists():
              print(f"Environment: {environment.read_text().strip()}\n")
          print("| Suite | Tests | Failures | Errors | Skipped |")
          print("|---|---:|---:|---:|---:|")
          for report in sorted(results.glob("*.xml")):
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              counts = [sum(int(s.get(key, "0")) for s in suites)
                        for key in ("tests", "failures", "errors", "skipped")]
              print(f"| {os.environ['PLATFORM']} {report.stem} | " + " | ".join(map(str, counts)) + " |")
          PY

      - name: Upload test reports and logs
        if: ${{ always() && env.CI_RESULTS != '' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsworld-results-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the tested commit image to GHCR Packages
        if: env.PUBLISH == 'true'
        timeout-minutes: 30
        env:
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          image_tag="$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          docker tag "$CANDIDATE_IMAGE" "$image_tag"
          docker push "$image_tag"
          {
            printf 'Published commit image: `%s`\n\n' "$image_tag"
            printf 'Tested by: %s\n\n' "$CI_URL"
            docker image inspect --format '{{json .RepoDigests}}' "$image_tag"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest if the tested commit is still main
        if: env.PUBLISH == 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            printf 'Kept the commit image; skipped latest because main has advanced.\n' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "$CANDIDATE_IMAGE" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:latest"
          printf 'Updated latest: `%s:latest`\n' "$IMAGE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release tag
    # bscontroller-v* releases publish only the bscontroller package (pypi.yml).
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'bscontroller-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate the release tag
        run: |
          # Keep the Git tag unchanged; reserve the main publication tags.
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ||
                "$RELEASE_TAG" == latest || "$RELEASE_TAG" == sha-* ]]; then
            printf 'Unsupported release image tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve the release commit
        run: |
          # HEAD resolves both annotated and lightweight tags to their commit.
          source_sha="$(git rev-parse HEAD)"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}-$PLATFORM"
          {
            echo "SOURCE_SHA=$source_sha"
            echo "COMMIT_IMAGE=$image_repository:sha-$source_sha"
            echo "RELEASE_IMAGE=$image_repository:$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the tested commit image
        run: |
          if ! docker pull "$COMMIT_IMAGE"; then
            printf 'Cannot pull %s. Wait for its main workflow to publish the image, then retry.\n' "$COMMIT_IMAGE" >&2
            exit 1
          fi
          revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$COMMIT_IMAGE")"
          if [[ "$revision" != "$SOURCE_SHA" ]]; then
            printf 'The image revision does not match the release commit.\n' >&2
            exit 1
          fi

      - name: Publish the release tag to GHCR Packages
        run: |
          # Add a version name to the tested image without rebuilding it.
          docker tag "$COMMIT_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          {
            printf 'Release image: `%s`\n\n' "$RELEASE_IMAGE"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Pull: `docker pull %s`\n\n' "$RELEASE_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
