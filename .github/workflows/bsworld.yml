name: BSWorld

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Replace obsolete PR checks, but keep every main commit eligible for a release.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANDIDATE_IMAGE: bsworld-ci:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  ci:
    name: CI result
    if: github.event_name != 'release'
    runs-on: [self-hosted, linux, x64, bsworld]
    timeout-minutes: 720
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
    env:
      PYTHON_TOOLING_IMAGE: bsworld-tooling:${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON_TEST_IMAGE: bsworld-python:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare reports directory
        run: |
          CI_RESULTS="$RUNNER_TEMP/bsworld-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$CI_RESULTS"
          chmod a+rwx "$CI_RESULTS"
          echo "CI_RESULTS=$CI_RESULTS" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Reuse this runner's BuildKit state across workflow runs.
          name: bsworld-ci
          keep-state: true
          cache-binary: false
          buildkitd-config-inline: |
            [worker.oci]
              reservedSpace = 24000000000 # 24 GB
              maxUsedSpace = 36000000000 # 36 GB
              minFreeSpace = 24000000000 # 24 GB

      - name: Prepare Python tooling in Docker
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: bsworld
          platforms: linux/amd64
          load: true
          tags: ${{ env.PYTHON_TOOLING_IMAGE }}
          no-cache: ${{ inputs.rebuild_image || false }}

      - name: Read the Git-derived package version in Docker
        timeout-minutes: 5
        run: |
          package_version="$(docker run --rm \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --env PYTHONDONTWRITEBYTECODE --env GIT_OPTIONAL_LOCKS=0 \
            "$PYTHON_TOOLING_IMAGE" python -m setuptools_scm)"
          if [[ -z "$package_version" || "$package_version" == '0+unknown' ]]; then
            printf 'Could not determine the BSWorld version from Git.\n' >&2
            exit 1
          fi
          echo "BSWORLD_VERSION=$package_version" >> "$GITHUB_ENV"
          printf 'BSWorld package version: %s\n' "$package_version"

      - name: Build the Python test image
        id: python_image
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: python-test
          platforms: linux/amd64
          load: true
          tags: ${{ env.PYTHON_TEST_IMAGE }}
          build-args: BSWORLD_VERSION=${{ env.BSWORLD_VERSION }}
          # The tooling build already refreshed the shared layers when requested.
          no-cache-filters: ${{ inputs.rebuild_image && 'python-test' || '' }}

      - name: Lint in Docker
        timeout-minutes: 10
        run: |
          docker run --rm \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --env PYTHONDONTWRITEBYTECODE \
            "$PYTHON_TEST_IMAGE" python -m ruff check --no-cache src tests \
            2>&1 | tee "$CI_RESULTS/ruff.log"

      - name: Run unit tests in Docker
        timeout-minutes: 30
        run: |
          docker run --rm \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --mount "type=bind,src=$CI_RESULTS,dst=/output" \
            --env PYTHONDONTWRITEBYTECODE \
            "$PYTHON_TEST_IMAGE" python -m pytest tests/unit -q -p no:cacheprovider \
              --out-dir /output/unit --junitxml=/output/unit.xml \
            2>&1 | tee "$CI_RESULTS/unit.log"

      - name: Build firmware and assemble the runtime image
        timeout-minutes: 300
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          build-args: BSWORLD_VERSION=${{ env.BSWORLD_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Preserve the Python layers that just passed lint/unit, even on a rebuild.
          no-cache-filters: ${{ inputs.rebuild_image && 'babblesim,zephyr,nuttx,qemu,trouble,buildroot,runtime' || '' }}

      - name: Record the candidate image
        id: image
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          printf '%s\n' "$CANDIDATE_IMAGE" > "$CI_RESULTS/environment.txt"
          docker image inspect "$image_id" > "$CI_RESULTS/image.json"

      - name: Run integration tests in Docker
        timeout-minutes: 300
        run: |
          docker run --rm \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --mount "type=bind,src=$CI_RESULTS,dst=/output" \
            --env PYTHONDONTWRITEBYTECODE \
            "$IMAGE_ID" python -m pytest tests/integration -n 2 -p no:cacheprovider \
              --out-dir /output/integration --junitxml=/output/integration.xml \
            2>&1 | tee "$CI_RESULTS/integration.log"

      - name: Summarize test reports
        if: ${{ always() && steps.python_image.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          docker run --rm -i \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --mount "type=bind,src=$CI_RESULTS,dst=/output,readonly" \
            "$PYTHON_TEST_IMAGE" python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results = Path("/output")
          environment = results / "environment.txt"
          if environment.exists():
              print(f"Environment: {environment.read_text().strip()}\n")
          print("| Suite | Tests | Failures | Errors | Skipped |")
          print("|---|---:|---:|---:|---:|")
          for report in sorted(results.glob("*.xml")):
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              counts = [sum(int(s.get(key, "0")) for s in suites)
                        for key in ("tests", "failures", "errors", "skipped")]
              print(f"| {report.stem} | " + " | ".join(map(str, counts)) + " |")
          PY

      - name: Upload test reports and logs
        if: ${{ always() && env.CI_RESULTS != '' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsworld-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS }}
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up local CI containers and images
        if: always()
        timeout-minutes: 5
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          docker ps -aq --filter "label=bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            | xargs -r docker rm -f
          docker image rm "$PYTHON_TOOLING_IMAGE" "$PYTHON_TEST_IMAGE" > /dev/null 2>&1 || true
          # A successful main run keeps the candidate until the publish job uses it.
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ||
                "$CI_JOB_STATUS" != success ]]; then
            docker image rm "$CANDIDATE_IMAGE" > /dev/null 2>&1 || true
          fi

  publish:
    name: Publish main image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, bsworld]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_ID: ${{ needs.ci.outputs.image_id }}
    steps:
      - name: Prepare the tested image for publication
        run: |
          docker image inspect "$IMAGE_ID" > /dev/null
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "IMAGE_REPOSITORY=$image_repository"
            echo "IMAGE_TAG=$image_repository:sha-$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested commit image to GHCR Packages
        env:
          SOURCE_SHA: ${{ github.sha }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          docker tag "$IMAGE_ID" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          {
            printf 'Published commit image: `%s`\n\n' "$IMAGE_TAG"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Tested by: %s\n\n' "$CI_URL"
            docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest if the tested commit is still main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_sha="$(docker run --rm -i \
            --label "bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --env GH_TOKEN --env GITHUB_API_URL --env GITHUB_REPOSITORY \
            "$IMAGE_ID" python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          request = Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "BSWorld-CD",
          })
          with urlopen(request, timeout=30) as response:
              print(json.load(response)["object"]["sha"])
          PY
          )"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            docker tag "$IMAGE_ID" "$IMAGE_REPOSITORY:latest"
            docker push "$IMAGE_REPOSITORY:latest"
            printf 'Updated latest: `%s:latest`\n' "$IMAGE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Kept the commit image; skipped latest because main has advanced.\n' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up local publication containers and tags
        if: always()
        timeout-minutes: 5
        run: |
          docker ps -aq --filter "label=bsworld.ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            | xargs -r docker rm -f
          for tag in "$CANDIDATE_IMAGE" "${IMAGE_TAG:-}" "${IMAGE_REPOSITORY:-}:latest"; do
            if [[ "$(docker image inspect --format '{{.Id}}' "$tag" 2>/dev/null)" == "$IMAGE_ID" ]]; then
              docker image rm "$tag" > /dev/null 2>&1 || true
            fi
          done

  release:
    name: Publish release tag
    # bscontroller-v* releases publish only the bscontroller package (pypi.yml).
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'bscontroller-')
    runs-on: [self-hosted, linux, x64, bsworld]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate the release tag
        run: |
          # Keep the Git tag unchanged; reserve the main publication tags.
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ||
                "$RELEASE_TAG" == latest || "$RELEASE_TAG" == sha-* ]]; then
            printf 'Unsupported release image tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Resolve the release commit
        run: |
          # HEAD resolves both annotated and lightweight tags to their commit.
          source_sha="$(git rev-parse HEAD)"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "SOURCE_SHA=$source_sha"
            echo "COMMIT_IMAGE=$image_repository:sha-$source_sha"
            echo "RELEASE_IMAGE=$image_repository:$RELEASE_TAG"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the tested commit image
        run: |
          if ! docker pull "$COMMIT_IMAGE"; then
            printf 'Cannot pull %s. Wait for its main workflow to publish the image, then retry.\n' "$COMMIT_IMAGE" >&2
            exit 1
          fi
          image_id="$(docker image inspect --format '{{.Id}}' "$COMMIT_IMAGE")"
          revision="$(docker image inspect \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
          if [[ "$revision" != "$SOURCE_SHA" ]]; then
            printf 'The image revision does not match the release commit.\n' >&2
            exit 1
          fi
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      - name: Publish the release tag to GHCR Packages
        run: |
          # Add a version name to the tested image without rebuilding it.
          docker tag "$IMAGE_ID" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          {
            printf 'Release image: `%s`\n\n' "$RELEASE_IMAGE"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Pull: `docker pull %s`\n\n' "$RELEASE_IMAGE"
            docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_ID"
          } >> "$GITHUB_STEP_SUMMARY"
