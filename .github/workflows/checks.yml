name: Checks

# The CI workflow runs these checks for pull requests and pushes to main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install BSWorld and its test tools
        # Includes the pinned Ruff; a shallow checkout uses the fallback version.
        run: python -m pip install -e components/bscontroller -e '.[test]'

      - name: Check all Python source and imports
        run: python -m ruff check --no-cache .

      - name: Check Python formatting
        run: python -m ruff format --check --no-cache .

      - name: Run unit tests
        # Neither suite needs BabbleSim, firmware or other native artifacts.
        run: python -m pytest tests/unit tests/integration/support -n auto -q -p no:cacheprovider
