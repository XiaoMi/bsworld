# Reuse Zephyr tests/bluetooth/shell without application source changes.
CONFIG_TEST=y
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Host-only firmware connects to BSWorld's independent Controller over HCI.
CONFIG_BT=y
CONFIG_BT_SHELL=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="BSWorld shell"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=4
CONFIG_BT_PER_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_MAX=2
# Periodic Advertising Sync Transfer: "bt per-adv-set-info-transfer",
# "bt per-adv-sync-transfer" and "bt past-subscribe". Remote information
# reports the peer's LE features, which a sender needs before a transfer.
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
CONFIG_BT_REMOTE_INFO=y

# The upstream native-PTY overlay connects uart0 to standard input/output.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="bsworld> "
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_CMD_BUFF_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_BACKEND_SHOW_COLOR=n
