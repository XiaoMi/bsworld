# Kconfig overlay for Zephyr's samples/bluetooth/hci_virt.

# Data Length Update up to the 251-octet LL maximum.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# With a 251-octet LL maximum, the Controller rejects Host_Buffer_Size from
# Hosts with smaller ACL buffers, such as NuttX (74 octets).
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
