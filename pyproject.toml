[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bsworld"
dynamic = ["version"]
description = "Deterministic simulation test framework for Bluetooth LE Applications"
# The bundled BSController contributes the ISC-licensed terminal color utility.
license = "Apache-2.0 AND ISC"
license-files = ["LICENSE", "components/bscontroller/LICENSE", "components/bscontroller/NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4",
    "pytest-xdist>=3.0",
    "pytest-asyncio>=1.4",
    "bumble==0.0.235",
    "cryptography>=44.0.3",
    "packaging>=24",
    "pytest-cov>=4.0",
    "ruff==0.14.10",
    "setuptools>=68",
    "setuptools-scm>=8",
]

[project.entry-points.pytest11]
bsworld = "bsworld.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.14.10"
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "preserve"

[tool.coverage.run]
source = ["bsworld"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
